<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo | FABRIC K TECNOLOGÍAS</title>
<meta name="description" content="Explorá el catálogo completo de FABRIC K TECNOLOGÍAS: auriculares, parlantes, soportes, accesorios y tecnología. Buscá, filtrá y consultá por WhatsApp.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230B0D10%22/><text x=%2250%22 y=%2266%22 font-family=%22Arial%22 font-weight=%22800%22 font-size=%2252%22 fill=%22%23B8F23A%22 text-anchor=%22middle%22>FK</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="catalogo.html">

<div id="site-header"></div>

<main>
  <div class="page-hero section-dark">
    <span class="eyebrow">TIENDA</span>
    <h1>Catálogo</h1>
    <p>Buscá por nombre, filtrá por categoría o precio, y consultá disponibilidad directo por WhatsApp.</p>
  </div>

  <section class="section section-dark" style="padding-top:20px;" id="categorias">
    <div class="cat-pill-row" id="catPillRow"></div>

    <div class="catalog-layout">
      <aside class="catalog-filters">
        <div class="filter-group">
          <h4>Categoría</h4>
          <div class="filter-chip-list" id="catFilterList">
            <button class="filter-chip active" data-catfilter="all">Todas</button>
          </div>
        </div>
        <div class="filter-group">
          <h4>Precio</h4>
          <select class="filter-select" id="filterPrice">
            <option value="all">Cualquier precio</option>
            <option value="low">Hasta $8.000</option>
            <option value="mid">$8.000 – $20.000</option>
            <option value="high">Más de $20.000</option>
          </select>
        </div>
        <div class="filter-group">
          <h4>Disponibilidad</h4>
          <select class="filter-select" id="filterAvailability">
            <option value="all">Todos</option>
            <option value="stock">En stock</option>
            <option value="offers">En oferta</option>
            <option value="new">Novedades</option>
          </select>
        </div>
      </aside>

      <div class="catalog-main">
        <div class="catalog-toolbar">
          <div class="catalog-search-row">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8" fill="none"/><line x1="21" y1="21" x2="16.2" y2="16.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input type="text" id="catalogSearch" placeholder="Buscar en el catálogo...">
          </div>
          <div style="display:flex; align-items:center; gap:16px;">
            <span class="catalog-count" id="catalogCount"></span>
            <select class="filter-select" id="sortSelect" style="width:auto;">
              <option value="relevance">Más relevantes</option>
              <option value="new">Más nuevos</option>
              <option value="price-asc">Precio: menor a mayor</option>
              <option value="price-desc">Precio: mayor a menor</option>
            </select>
          </div>
        </div>

        <div class="product-grid product-grid--6" id="catalogGrid"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<div id="floating-tools"></div>

<script src="products.js"></script>
<script src="render.js"></script>
<script src="filters.js"></script>
<script src="app.js"></script>
<script>
  function onPageReady(){
    const list = document.getElementById("catFilterList");
    CATEGORIES.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "filter-chip";
      btn.dataset.catfilter = c.slug;
      btn.textContent = c.name;
      list.appendChild(btn);
    });

    const pillRow = document.getElementById("catPillRow");
    pillRow.innerHTML = `<button class="filter-chip active" data-catfilter="all">Todas</button>` +
      CATEGORIES.map(c => `<button class="filter-chip" data-catfilter="${c.slug}">${c.name}</button>`).join("");

    initCatalogFilters();

    // keep the pill row + sidebar in sync
    document.querySelectorAll("[data-catfilter]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-catfilter]").forEach(b => b.classList.toggle("active", b.dataset.catfilter === btn.dataset.catfilter));
      });
    });
  }
</script>
</body>
</html>
